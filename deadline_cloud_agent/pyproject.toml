[project]
name = "deadline_cloud_agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chroma>=0.2.0",
    "conda-index>=0.6.1",
    "deadline>=0.49.8",
    "deadline-cloud>=5.0.1",
    "halo>=0.0.31",
    "markdownify>=1.1.0",
    "openjd-model>=0.8.0",
    "opentelemetry-propagator-aws-xray>=1.0.2",
    "pyyaml>=6.0.2",
    "strands-agents>=0.1.4",
    "strands-agents-tools>=0.1.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
deadline = { path = "../../deadline/deadline-cloud" }
