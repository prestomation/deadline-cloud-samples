specificationVersion: 'jobtemplate-2023-09'
name: Maya USD Render
description: |
  This job bundle renders a USD scene using Maya with the Maya USD plugin (maya-usd) and Arnold renderer.

  To run it, you will need Maya, the Maya USD plugin, and Arnold (mtoa) available in the PATH in one of the following ways:
    * As conda packages when your queue has a conda queue environment set up to
      provide virtual environments for jobs.
    * Installed on the worker hosts that run the job. You can customize your Deadline Cloud
      queue, fleets, and this job to fit your own production pipeline.

parameterDefinitions:

# Render Parameters
- name: USDSceneFile
  type: PATH
  objectType: FILE
  dataFlow: IN
  userInterface:
    control: CHOOSE_INPUT_FILE
    label: USD Scene File
    groupLabel: Render Parameters
    fileFilters:
    - label: USD Scene Files
      patterns: ["*.usd", "*.usdc", "*.usda", "*.usdz"]
    - label: All Files
      patterns: ["*"]
  description: >
    Choose the USD scene file you want to render.
  default: assets/apple_scene.usda
- name: AssetDir
  type: PATH
  objectType: DIRECTORY
  dataFlow: IN
  userInterface:
    control: CHOOSE_DIRECTORY
    label: Asset Directory
    groupLabel: Render Parameters
  description: >
    Directory containing USD assets, textures, and referenced files.
  default: assets
- name: Frames
  type: STRING
  userInterface:
    control: LINE_EDIT
    label: Frames
    groupLabel: Render Parameters
  default: "1"
- name: OutputDir
  type: PATH
  objectType: DIRECTORY
  dataFlow: OUT
  userInterface:
    control: CHOOSE_DIRECTORY
    label: Output Directory
    groupLabel: Render Parameters
  description: Choose the render output directory.
  default: output
- name: ImageWidth
  type: INT
  userInterface:
    control: SPIN_BOX
    label: Image Width
    groupLabel: Render Parameters
  default: 1920
- name: ImageHeight
  type: INT
  userInterface:
    control: SPIN_BOX
    label: Image Height
    groupLabel: Render Parameters
  default: 1080

# Software Environment
- name: CondaPackages
  type: STRING
  userInterface:
    control: HIDDEN
  description: >
    This parameter provides a default value for the Conda environment,
    specifying maya-usd to provide Maya with the USD plugin and Arnold for rendering.
  default: maya-usd=0.32.0 maya-mtoa=2026.5.5

steps:
- name: Render
  parameterSpace:
    taskParameterDefinitions:
    - name: Frame
      type: INT
      range: "{{Param.Frames}}"
  script:
    embeddedFiles:
    - name: Render
      filename: render.py
      type: TEXT
      data: |
        import sys
        import os
        import maya.standalone
        maya.standalone.initialize()

        import maya.cmds as cmds
        cmds.loadPlugin("mtoa")

        # Get USD file path
        usd_file = r'{{Param.USDSceneFile}}'
        print(f"USD file: {usd_file}")

        # Create Arnold StandIn node to load USD via Arnold's USD procedural
        standin_shape = cmds.createNode('aiStandIn', name='usdStandInShape')
        standin_transform = cmds.listRelatives(standin_shape, parent=True)[0]
        cmds.setAttr(f'{standin_shape}.dso', usd_file, type='string')
        # Scale up since USD scene uses meters, Maya uses cm
        cmds.setAttr(f'{standin_transform}.scaleX', 100)
        cmds.setAttr(f'{standin_transform}.scaleY', 100)
        cmds.setAttr(f'{standin_transform}.scaleZ', 100)
        print(f"Created Arnold StandIn: {standin_transform}")

        # Create a utility shader for visualization (aiStandardSurface doesn't work via operators)
        shader = cmds.shadingNode('aiUtility', asShader=True, name='appleShader')
        cmds.setAttr(f'{shader}.shadeMode', 2)  # ndoteye mode for nice shading
        cmds.setAttr(f'{shader}.color', 0.75, 0.2, 0.15, type='double3')

        # Create operator to assign shader
        op = cmds.createNode('aiSetParameter', name='shaderOp')
        cmds.setAttr(f'{op}.selection', '/World/*', type='string')
        cmds.setAttr(f'{op}.assignment[0]', f'shader = "{shader}"', type='string')
        cmds.connectAttr(f'{op}.out', f'{standin_shape}.operators[0]')
        print(f"Created apple shader: {shader}")

        # Set render resolution
        cmds.setAttr("defaultResolution.width", {{Param.ImageWidth}})
        cmds.setAttr("defaultResolution.height", {{Param.ImageHeight}})

        # Set up output
        frame = {{Task.Param.Frame}}
        output_dir = r'{{Param.OutputDir}}'
        os.makedirs(output_dir, exist_ok=True)

        # Use persp camera and position it to see the apple scene
        render_camera = 'persp'
        cmds.setAttr('persp.translateX', 30)
        cmds.setAttr('persp.translateY', 20)
        cmds.setAttr('persp.translateZ', 50)
        cmds.setAttr('persp.rotateX', -15)
        cmds.setAttr('persp.rotateY', 30)
        cmds.setAttr("perspShape.renderable", 1)

        # Create Arnold sky dome light for illumination
        dome_light = cmds.createNode('aiSkyDomeLight', name='arnoldSkyDome')
        cmds.setAttr(f'{dome_light}.intensity', 1.0)
        print(f"Created Arnold sky dome light")

        # Configure Arnold renderer
        cmds.setAttr("defaultRenderGlobals.ren", "arnold", type="string")
        cmds.setAttr("defaultRenderGlobals.imageFormat", 32)  # PNG
        cmds.setAttr("defaultRenderGlobals.outFormatControl", 0)
        cmds.setAttr("defaultRenderGlobals.extensionPadding", 4)
        cmds.setAttr("defaultRenderGlobals.putFrameBeforeExt", 1)
        cmds.setAttr("defaultRenderGlobals.animation", 1)
        cmds.setAttr("defaultRenderGlobals.startFrame", frame)
        cmds.setAttr("defaultRenderGlobals.endFrame", frame)

        # Set output path
        output_prefix = '{}/output'.format(output_dir)
        cmds.setAttr("defaultRenderGlobals.imageFilePrefix", output_prefix, type="string")

        # Set frame
        cmds.currentTime(frame)

        # Save scene to temp file for batch render
        temp_scene = os.path.join(output_dir, 'temp_scene.ma')
        cmds.file(rename=temp_scene)
        cmds.file(save=True, type='mayaAscii')

        maya.standalone.uninitialize()

        # Use Maya Render command with Arnold
        import subprocess
        result = subprocess.run([
            'Render',
            '-r', 'arnold',
            '-s', str(frame),
            '-e', str(frame),
            '-rd', output_dir,
            '-im', 'output',
            '-cam', render_camera,
            temp_scene
        ], capture_output=True, text=True)
        print(result.stdout)
        if result.stderr:
            print(result.stderr, file=sys.stderr)
        sys.exit(result.returncode)
    - name: RunScript
      filename: run.sh
      type: TEXT
      data: |
        #!/bin/bash
        # Set up library, plugin, Python, and script paths for MayaUSD and Arnold.
        # The .mod file placeholders don't resolve in batch mode, so set paths explicitly.
        if [ -n "$CONDA_PREFIX" ]; then
            MAYA_LIB="$CONDA_PREFIX/usr/autodesk/maya${MAYA_VERSION:-2026}/lib"
            # Find MayaUSD root, lib, and plugin dirs (handles both MayaUSD/ and MayaUSD_<ver>/ layouts)
            MAYAUSD_ROOT=$(find "$CONDA_PREFIX/usr/autodesk/mayausd" -type d -name "MayaUSD*" -not -name "*.d" 2>/dev/null | sort -V | tail -1)
            MAYAUSD_LIB="$MAYAUSD_ROOT/lib"
            MAYAUSD_PLUGIN="$MAYAUSD_ROOT/plugin/adsk/plugin"
            MAYAUSD_SCRIPTS="$MAYAUSD_ROOT/plugin/adsk/scripts"
            MAYAUSD_PYTHON="$MAYAUSD_ROOT/lib/python"
            # Find USD root for pxr Python bindings
            USD_ROOT=$(find "$CONDA_PREFIX/usr/autodesk/mayausd" -type d -name "USD*" -not -name "*.d" 2>/dev/null | sort -V | tail -1)
            USD_PYTHON="${USD_ROOT:+$USD_ROOT/lib/python}"
            export LD_LIBRARY_PATH="$MAYA_LIB:$MAYAUSD_LIB:${USD_ROOT:+$USD_ROOT/lib:}${LD_LIBRARY_PATH:-}"
            export MAYA_PLUG_IN_PATH="$MAYAUSD_PLUGIN:${MAYA_PLUG_IN_PATH:-}"
            export MAYA_SCRIPT_PATH="$MAYAUSD_SCRIPTS:${MAYA_SCRIPT_PATH:-}"
            export PYTHONPATH="$MAYAUSD_PYTHON:${USD_PYTHON:+$USD_PYTHON:}${PYTHONPATH:-}"
        fi
        exec mayapy "{{Task.File.Render}}"
    actions:
      onRun:
        command: bash
        args: ['{{Task.File.RunScript}}']
  hostRequirements:
    attributes:
    - name: attr.worker.os.family
      anyOf:
      - linux
