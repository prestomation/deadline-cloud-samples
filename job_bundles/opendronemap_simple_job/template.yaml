specificationVersion: jobtemplate-2023-09
name: OpenDroneMap Brighton Beach reconstruction
description: |
  Process the pinned 18-image Brighton Beach aerial survey with OpenDroneMap
  3.6.1 in a CPU-only Docker container. The single task produces a GeoTIFF
  orthophoto, LAZ point cloud, elevation models, textured OBJ, processing
  report, complete log, and a checksummed run manifest.

parameterDefinitions:
  - name: OutputDir
    type: PATH
    objectType: DIRECTORY
    dataFlow: OUT
    default: ./output
    description: Directory that receives the open_drone_map result folder.
    userInterface:
      control: CHOOSE_DIRECTORY
      label: Output directory
      groupLabel: Output

  - name: OrthophotoResolution
    type: INT
    default: 10
    minValue: 1
    description: Orthophoto ground resolution in centimeters per pixel.
    userInterface:
      control: SPIN_BOX
      label: Orthophoto resolution (cm/pixel)
      groupLabel: Processing

  - name: FeatureQuality
    type: STRING
    default: low
    allowedValues:
      - ultra
      - high
      - medium
      - low
      - lowest
    description: ODM feature extraction quality.
    userInterface:
      control: DROPDOWN_LIST
      label: Feature quality
      groupLabel: Processing

  - name: PointCloudQuality
    type: STRING
    default: lowest
    allowedValues:
      - ultra
      - high
      - medium
      - low
      - lowest
    description: ODM dense point cloud quality.
    userInterface:
      control: DROPDOWN_LIST
      label: Point cloud quality
      groupLabel: Processing

  - name: GenerateDsm
    type: STRING
    default: "True"
    allowedValues:
      - "True"
      - "False"
    description: Generate a digital surface model.
    userInterface:
      control: CHECK_BOX
      label: Generate DSM
      groupLabel: Elevation models

  - name: GenerateDtm
    type: STRING
    default: "False"
    allowedValues:
      - "True"
      - "False"
    description: Generate a classified digital terrain model.
    userInterface:
      control: CHECK_BOX
      label: Generate DTM
      groupLabel: Elevation models

  - name: MaxConcurrency
    type: INT
    default: 2
    minValue: 1
    description: Maximum number of concurrent ODM worker processes.
    userInterface:
      control: SPIN_BOX
      label: Maximum concurrency
      groupLabel: Processing

  - name: JobScriptDir
    type: PATH
    objectType: DIRECTORY
    dataFlow: IN
    default: scripts
    description: Directory containing the bundled execution scripts.
    userInterface:
      control: HIDDEN

steps:
  - name: ProcessSurvey
    description: Download, verify, process, validate, and package the survey.
    hostRequirements:
      attributes:
        - name: attr.worker.os.family
          anyOf:
            - linux
        - name: attr.OpenDroneMap
          anyOf:
            - docker_3_6_1
      amounts:
        - name: amount.worker.vcpu
          min: 2
        - name: amount.worker.memory
          min: 8192
    script:
      actions:
        onRun:
          command: bash
          args:
            - "{{Param.JobScriptDir}}/run_open_drone_map.sh"
            - "{{Task.File.OutputDir}}"
            - "{{Task.File.OrthophotoResolution}}"
            - "{{Task.File.FeatureQuality}}"
            - "{{Task.File.PointCloudQuality}}"
            - "{{Task.File.GenerateDsm}}"
            - "{{Task.File.GenerateDtm}}"
            - "{{Task.File.MaxConcurrency}}"
          cancelation:
            mode: NOTIFY_THEN_TERMINATE
            notifyPeriodInSeconds: 60
      embeddedFiles:
        - name: OutputDir
          type: TEXT
          data: "{{Param.OutputDir}}"
        - name: OrthophotoResolution
          type: TEXT
          data: "{{Param.OrthophotoResolution}}"
        - name: FeatureQuality
          type: TEXT
          data: "{{Param.FeatureQuality}}"
        - name: PointCloudQuality
          type: TEXT
          data: "{{Param.PointCloudQuality}}"
        - name: GenerateDsm
          type: TEXT
          data: "{{Param.GenerateDsm}}"
        - name: GenerateDtm
          type: TEXT
          data: "{{Param.GenerateDtm}}"
        - name: MaxConcurrency
          type: TEXT
          data: "{{Param.MaxConcurrency}}"
